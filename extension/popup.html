<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Brainly Saver</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #f5f5f5;
        color: #000;
        width: 280px;
        min-height: 320px;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 3px solid #000;
        overflow-x: hidden;
      }
      ::selection {
        background: #000;
        color: #fff;
      }

      /* Core Layouts */
      .header {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 2px solid #000;
        background-color: #e5e5e5;
      }
      .header-logo {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .logo-box {
        width: 20px;
        height: 20px;
        border: 2px solid #000;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 9px;
        box-shadow: 1px 1px 0 0 #000;
      }
      .header h1 {
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        line-height: 1;
      }

      .abort-btn {
        font-size: 8px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border: 2px solid transparent;
        background: transparent;
        cursor: pointer;
        padding: 2px 4px;
        transition: color 0.2s;
      }
      .abort-btn:hover {
        color: #dc2626;
        border-color: #000;
      }

      .view {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 12px;
        background-color: #f5f5f5;
      }
      .hidden {
        display: none !important;
      }

      /* Loader */
      .loader-view {
        align-items: center;
        justify-content: center;
        padding: 32px 0;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid #000;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      .loader-text {
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 8px;
      }

      /* Typography & Utils */
      h2.title {
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        line-height: 1;
        letter-spacing: -0.05em;
        margin-bottom: 4px;
      }
      p.subtitle {
        font-size: 8px;
        font-weight: 700;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 16px;
      }

      .form-group {
        margin-bottom: 8px;
      }

      select,
      input,
      textarea {
        width: 100%;
        padding: 6px 8px;
        border: 2px solid #000;
        background: #e5e5e5;
        font-family: inherit;
        font-size: 10px;
        font-weight: 700;
        outline: none;
        transition: all 0.2s;
        resize: none;
        color: #000;
      }
      select:focus,
      input:focus,
      textarea:focus {
        background: #fff;
        box-shadow: 2px 2px 0 0 #000;
      }
      textarea {
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
      }

      .type-select {
        background: transparent;
        border: none;
        font-size: 8px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        color: #000;
      }

      .btn {
        width: 100%;
        background: #000;
        color: #fff;
        padding: 8px 12px;
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border: 2px solid #000;
        box-shadow: 2px 2px 0 0 #000;
        cursor: pointer;
        transition: all 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:hover {
        box-shadow: 3px 3px 0 0 #000;
      }
      .btn:active {
        box-shadow: none;
        transform: translateY(2px);
      }
      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .error-text {
        color: #dc2626;
        font-size: 8px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-align: center;
        margin-top: 6px;
      }
      .status-box {
        background: #e5e5e5;
        border: 2px solid #000;
        text-align: center;
        padding: 4px;
        font-size: 8px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #000;
      }
      .status-success {
        color: #16a34a;
      }
      .status-error {
        color: #dc2626;
      }

      .material-symbols-outlined {
        font-size: 14px;
        vertical-align: middle;
      }

      .select-wrapper {
        position: relative;
      }
      .select-wrapper select {
        appearance: none;
        cursor: pointer;
        position: relative;
        z-index: 10;
        background: transparent;
      }
      .select-wrapper::after {
        content: "expand_more";
        font-family: "Material Symbols Outlined";
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        pointer-events: none;
        opacity: 0.6;
      }
      .header-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <div class="logo-box">B</div>
        <div>
          <h1>Brainly</h1>
        </div>
      </div>
      <button id="logoutBtn" class="abort-btn hidden">Logout</button>
    </header>

    <!-- Loader -->
    <div id="loader" class="view loader-view">
      <div class="spinner"></div>
      <p class="loader-text">Syncing...</p>
    </div>

    <!-- AUTH VIEW -->
    <section id="auth-view" class="view hidden">
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center;">
        <h2 class="title">Sync Required</h2>
        <p class="subtitle">Link your web session to continue.</p>
      </div>

      <button id="syncWebBtn" class="btn">
        <svg style="width: 14px; height: 14px; background: white; border-radius: 50%; padding: 1px;" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Sync with Web App
      </button>
      <p id="authError" class="error-text hidden"></p>
    </section>

    <!-- WORKSPACE VIEW -->
    <section id="workspace-view" class="view hidden">
      <form id="saveForm" style="display: flex; flex-direction: column; height: 100%">
        
        <div class="form-group">
          <div class="select-wrapper bg-[#e5e5e5]">
            <select id="folderSelect" required>
              <option value="" disabled selected>Target Directory...</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <div class="header-controls">
            <span style="font-size: 8px; font-weight: 900; text-transform: uppercase;">Content</span>
            <select id="typeSelect" class="type-select">
              <option value="text">TEXT</option>
              <option value="link">LINK</option>
              <option value="image">IMAGE</option>
              <option value="code">CODE</option>
            </select>
          </div>
          <textarea id="contentInput" required rows="3" placeholder="Paste data here..."></textarea>
        </div>

        <div class="form-group">
          <textarea id="noteInput" rows="1" style="background: #fff" placeholder="Context notes (optional)"></textarea>
        </div>

        <div style="flex: 1"></div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <p id="saveStatus" class="status-box hidden"></p>
          <button type="submit" id="commitBtn" class="btn">
            Commit
          </button>
        </div>
      </form>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
